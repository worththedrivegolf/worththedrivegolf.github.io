<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Original Worth the Drive illustration of an in-bay simulator display.
       Sample data only — replaced by the owner's real GSPro screenshot at the
       same path. Brand palette throughout. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#123157"/>
      <stop offset="45%"  stop-color="#2C5A86"/>
      <stop offset="78%"  stop-color="#7BA0B4"/>
      <stop offset="100%" stop-color="#C9D6C2"/>
    </linearGradient>
    <linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4E8F30"/>
      <stop offset="100%" stop-color="#2E6B1E"/>
    </linearGradient>
    <linearGradient id="rough" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3C6B26"/>
      <stop offset="100%" stop-color="#1E4416"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A1424" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#0A1424" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A1424" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0A1424"/>

  <!-- course view -->
  <g>
    <rect x="0" y="0" width="1600" height="470" fill="url(#sky)"/>
    <!-- distant ridge -->
    <path d="M0 452 L150 400 L280 428 L420 372 L560 420 L700 386 L860 430 L1010 392 L1160 428 L1320 384 L1460 424 L1600 400 L1600 470 L0 470 Z" fill="#24435F" opacity="0.85"/>
    <path d="M0 470 L210 436 L390 462 L580 438 L780 466 L980 440 L1200 468 L1400 444 L1600 466 L1600 480 L0 480 Z" fill="#1B3A50"/>
    <!-- treeline -->
    <rect x="0" y="466" width="1600" height="34" fill="#16351F"/>
    <!-- rough -->
    <rect x="0" y="492" width="1600" height="408" fill="url(#rough)"/>
    <!-- fairway receding to the pin -->
    <path d="M690 496 L910 496 L1290 900 L300 900 Z" fill="url(#fairway)"/>
    <!-- mow stripes -->
    <g opacity="0.10" fill="#FFFFFF">
      <path d="M742 496 L772 496 L928 900 L838 900 Z"/>
      <path d="M812 496 L842 496 L1108 900 L1018 900 Z"/>
      <path d="M872 496 L900 496 L1286 900 L1198 900 Z"/>
    </g>
    <!-- green + flag -->
    <ellipse cx="800" cy="512" rx="128" ry="22" fill="#63B043"/>
    <ellipse cx="800" cy="510" rx="128" ry="22" fill="#77C455"/>
    <circle cx="836" cy="508" r="5" fill="#0E1A2E" opacity="0.6"/>
    <rect x="834" y="440" width="3" height="70" fill="#E8EEF6"/>
    <path d="M837 442 L889 456 L837 470 Z" fill="#CB161D"/>
    <!-- ball flight trace -->
    <path d="M470 852 C 560 610, 700 512, 834 496" fill="none" stroke="#F5C518" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="1 16" opacity="0.9"/>
    <circle cx="470" cy="852" r="9" fill="#FFFFFF"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>

  <!-- data readout -->
  <g font-family="Oswald, 'Arial Narrow', sans-serif">
    <g transform="translate(72,64)">
      <rect x="0" y="0" width="250" height="34" rx="4" fill="#5DA83A" opacity="0.16"/>
      <text x="14" y="23" fill="#7BC65B" font-size="17" font-weight="600" letter-spacing="3.4">SHOT 7 · 7 IRON</text>
    </g>

    <g transform="translate(72,700)">
      <!-- four metric tiles -->
      <g>
        <rect x="0" y="0" width="330" height="128" rx="10" fill="#0E1A2E" opacity="0.82"/>
        <rect x="0" y="0" width="330" height="128" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.13"/>
        <text x="22" y="40" fill="#8FA0B8" font-size="17" font-weight="500" letter-spacing="3">BALL SPEED</text>
        <text x="22" y="98" fill="#FFFFFF" font-size="52" font-weight="700">118.4<tspan font-size="22" fill="#C9D3E4" dx="8">MPH</tspan></text>
      </g>
      <g transform="translate(360,0)">
        <rect x="0" y="0" width="330" height="128" rx="10" fill="#0E1A2E" opacity="0.82"/>
        <rect x="0" y="0" width="330" height="128" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.13"/>
        <text x="22" y="40" fill="#8FA0B8" font-size="17" font-weight="500" letter-spacing="3">CARRY</text>
        <text x="22" y="98" fill="#FFFFFF" font-size="52" font-weight="700">171<tspan font-size="22" fill="#C9D3E4" dx="8">YDS</tspan></text>
      </g>
      <g transform="translate(720,0)">
        <rect x="0" y="0" width="330" height="128" rx="10" fill="#0E1A2E" opacity="0.82"/>
        <rect x="0" y="0" width="330" height="128" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.13"/>
        <text x="22" y="40" fill="#8FA0B8" font-size="17" font-weight="500" letter-spacing="3">LAUNCH</text>
        <text x="22" y="98" fill="#FFFFFF" font-size="52" font-weight="700">18.2<tspan font-size="22" fill="#C9D3E4" dx="8">DEG</tspan></text>
      </g>
      <g transform="translate(1080,0)">
        <rect x="0" y="0" width="330" height="128" rx="10" fill="#0E1A2E" opacity="0.82"/>
        <rect x="0" y="0" width="330" height="128" rx="10" fill="none" stroke="#7BC65B" stroke-opacity="0.45"/>
        <text x="22" y="40" fill="#8FA0B8" font-size="17" font-weight="500" letter-spacing="3">CLUB PATH</text>
        <text x="22" y="98" fill="#7BC65B" font-size="52" font-weight="700">1.4<tspan font-size="22" fill="#C9D3E4" dx="8">IN</tspan></text>
      </g>
    </g>
  </g>
</svg>
