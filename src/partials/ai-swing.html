<!-- AI Swing Trainer. Shared by the homepage and the Studio page.

     Content lives in technology.aiSwing in site.json, including the honesty
     note: the feature is in public beta from ProTee. Do not upgrade that
     wording to a finished-product claim while it is still beta. -->
<section class="band band-paper-alt" id="ai-swing">
  <div class="container">
    <div class="split" style="align-items:end;margin-bottom:clamp(36px,4vw,58px)">
      <div class="reveal">
        <span class="eyebrow">{{ technology.aiSwing.eyebrow }}</span>
        <h2 class="h2">{{ technology.aiSwing.heading }}</h2>
      </div>
      <p class="lead reveal" data-delay="1">{{ technology.aiSwing.lead }}</p>
    </div>

    <figure class="ai-swing-shot reveal">
      <div class="slot slot-16x9">
        <img src="images/studio-bay.jpg"
             srcset="images/studio-bay-800.jpg 800w, images/studio-bay.jpg 1365w"
             sizes="(min-width: 1025px) 70vw, 100vw"
             alt="Looking down a hitting bay at the simulator screen, with the ceiling-mounted launch monitor and its two cameras above the mat"
             loading="lazy" width="1365" height="768"/>
      </div>
      <figcaption class="slot-caption">Rendering of the planned studio. The launch monitor is the ceiling unit above the mat — the two cameras in it are what the Swing A.I. Trainer sees you with.</figcaption>
    </figure>

    <div class="grid grid-3">
      {{#each technology.aiSwing.points}}
      <div class="feature reveal" data-delay="{{ @index }}">
        <svg class="icon icon-lg icon-green" aria-hidden="true"><use href="#{{ this.icon }}"></use></svg>
        <h3>{{ this.title }}</h3>
        <p>{{ this.body }}</p>
      </div>
      {{/each}}
    </div>

    <p class="fine reveal" style="margin-top:clamp(30px,3vw,46px)">{{ technology.aiSwing.note }}</p>
  </div>
</section>
